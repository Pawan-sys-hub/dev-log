
name: Developer Activity Log

on:
  schedule:
    - cron: '10 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-log:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Record daily maintenance
        run: |
          DATE=$(TZ=Asia/Kathmandu date +%Y-%m-%d)
          mkdir -p activity
          echo "- Automated repository maintenance: $(date -u +%H:%M UTC)" >> "activity/$DATE.md"

      - name: Commit activity
        run: |
          git config user.name "Pawan-sys-hub"
          git config user.email "pawanpokharel523@gmail.com"
          git add activity/
          git commit -m "chore: update activity log"
          git push
